databases:
  - name: santorini-bookings-db
    plan: free
    region: oregon

services:
  - type: web
    name: new-santorini-suites
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: santorini-bookings-db
          property: connectionString
      - key: PUBLIC_URL
        value: https://new-santorini-suites.onrender.com
